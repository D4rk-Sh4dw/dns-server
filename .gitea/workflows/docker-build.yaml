name: Build and Push Docker Images

on:
  push:
    branches: ["main"]

env:
  # Konfiguriere diese Variablen in Gitea unter Repository -> Settings -> Actions -> Variables
  REGISTRY: ${{ vars.DOCKER_REGISTRY || 'docker.io' }}
  IMAGE_PREFIX: ${{ vars.DOCKER_IMAGE_PREFIX || 'your-username' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: frontend
            image_name: dns-dashboard
          - service: nginx
            image_name: dns-proxy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Lowercase Registry Details
        id: registry_case
        run: |
          RAW_PREFIX="${{ vars.DOCKER_IMAGE_PREFIX || github.repository_owner }}"
          echo "IMAGE_PREFIX=${RAW_PREFIX,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ steps.registry_case.outputs.IMAGE_PREFIX }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
