name: Build and Push Docker Images

on:
  push:
    branches:
      - main

env:
  REGISTRY: gitea.vmhaus.de

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: frontend
            image_name: dns-dashboard
          - service: nginx
            image_name: dns-proxy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITTOKEN }}  # <-- dein Secret hier

      - name: Prepare image namespace (lowercase owner)
        id: image_ns
        run: |
          OWNER="$(echo "$GITEA_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "OWNER=$OWNER" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: $GITEA_ACTOR
          password: ${{ secrets.GITTOKEN }}  # <-- wieder dein Secret

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ steps.image_ns.outputs.OWNER }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=latest,enable=${{ GITEA_REF == 'refs/heads/main' }}
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
