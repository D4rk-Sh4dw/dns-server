version: '3.8'

services:
  # --- Central Management Dashboard ---
  dashboard:
    # build: ./frontend
    image: ghcr.io/d4rk-sh4dw/dns-dashboard:latest
    container_name: dns-dashboard
    restart: unless-stopped
    environment:
      - ADGUARD_URL=http://dns-adguard:3000
      - ADGUARD_USER=${ADGUARD_USER}
      - ADGUARD_PASS=${ADGUARD_PASS}
      - TECHNITIUM_URL=http://dns-technitium:5380
      - TECHNITIUM_PASSWORD=${TECHNITIUM_PASSWORD}
      - AUTH_SECRET=${AUTH_SECRET}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # Disable built-in authentication when using forward auth (e.g., Authentik)
      # - AUTH_DISABLED=true
      # Cloudflare DNS Integration (optional)
      # - CLOUDFLARE_EMAIL=${CLOUDFLARE_EMAIL}
      # - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      # - CLOUDFLARE_API_KEY=${CLOUDFLARE_API_KEY}
    volumes:
      - ./config:/app/config_mount
      - ./data:/app/data_mount
    depends_on:
      - adguard
      - technitium
    networks:
      dns-net:
        ipv4_address: 172.25.0.102

  # --- Nginx Reverse Proxy ---
  nginx:
    image: ghcr.io/d4rk-sh4dw/dns-proxy:latest
    container_name: dns-proxy
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/templates:/etc/nginx/templates
      - ./nginx/start.sh:/start.sh
    environment:
      - ADGUARD_USER=${ADGUARD_USER}
      - ADGUARD_PASS=${ADGUARD_PASS}
      - TECHNITIUM_USER=${TECHNITIUM_USER}
      - TECHNITIUM_PASSWORD=${TECHNITIUM_PASSWORD}
    command: /bin/sh /start.sh
    depends_on:
      - dashboard
      - adguard
      - technitium
    networks:
      dns-net:
        ipv4_address: 172.25.0.105

  # --- AdGuard Home (Recursive DNS & AdBlocking) ---
  adguard:
    image: adguard/adguardhome:latest
    container_name: dns-adguard
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
#      - "3001:3000/tcp"
    volumes:
      - ./data/adguard/work:/opt/adguardhome/work
      - ./config/adguard:/opt/adguardhome/conf
    networks:
      dns-net:
        ipv4_address: 172.25.0.100

  # --- Technitium DNS (Authoritative DNS) ---
  technitium:
    image: technitium/dns-server:latest
    container_name: dns-technitium
    restart: unless-stopped
#    ports:
#      - "5380:5380/tcp" # Web Admin UI (not needed - accessed via Nginx proxy)
    expose:
      - "53/udp" # DNS port for internal Docker network
      - "53/tcp"
    environment:
      - DNS_SERVER_DOMAIN=dns.local
      - DNS_SERVER_ADMIN_PASSWORD=${TECHNITIUM_PASSWORD}
      - DNS_SERVER_PREFER_IPV6=false
      - DNS_SERVER_FORWARDERS=1.1.1.1,8.8.8.8
      - DNS_SERVER_RECURSION=Allow
      - DNS_SERVER_ENABLE_BLOCKING=false
    volumes:
      - ./data/technitium:/etc/dns
    networks:
      dns-net:
        ipv4_address: 172.25.0.101

networks:
  dns-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16