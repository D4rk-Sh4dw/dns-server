server {
    listen 80;
    server_name localhost;

    # Dashboard (Main App)
    location / {
        proxy_pass http://dns-dashboard:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AdGuard Home
    location /adguard/ {
        proxy_pass http://dns-adguard:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Basic YWRtaW46YWRtaW4xMjM=";

        # Rewrite redirect headers (Location: /login.html -> Location: /adguard/login.html)
        proxy_redirect / /adguard/;
        proxy_cookie_path / /adguard/;

        # Rewrite content to support subpath
        sub_filter_types text/html text/css text/javascript application/javascript;
        sub_filter 'href="/' 'href="/adguard/';
        sub_filter 'src="/' 'src="/adguard/';
        sub_filter 'action="/' 'action="/adguard/';
        sub_filter_once off;
    }

    # Technitium DNS
    location /technitium/ {
        proxy_pass http://dns-technitium:5380/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Rewrite cookies path
        proxy_cookie_path / /technitium/;

        # Rewrite content to support subpath
        sub_filter_types text/html text/css text/javascript application/javascript;
        sub_filter 'href="/' 'href="/technitium/';
        sub_filter 'src="/' 'src="/technitium/';
        sub_filter 'action="/' 'action="/technitium/';

        # Technitium specific API rewrites might be needed
        sub_filter '/api/' '/technitium/api/';
        # Inject Autologin Script (Robust)
        sub_filter '</body>' '<script>
        (function() {
            var attempts = 0;
            var maxAttempts = 20; // Try for 10 seconds
            var interval = setInterval(function() {
                attempts++;
                // Generic selectors usually work better than specific IDs for different versions
                var u = document.querySelector("input[type=text], input[name=user], #user");
                var p = document.querySelector("input[type=password], input[name=pass], #pass");
                var b = document.querySelector("button[type=submit], #login-btn, .btn-primary");
                
                // Extra check: make sure we are actually on a login page (look for password field)
                if (p && !u) {
                     // Sometimes username is hidden or pre-filled? Just find previous input
                     u = p.previousElementSibling || p.parentElement.previousElementSibling.querySelector("input");
                }

                if (u && p && b) {
                    // Check if already logged in (often redirection happens fast, but if we see form, we act)
                    if (u.value === "" || p.value === "") {
                        console.log("Technitium Autologin: Form found, injecting...");
                        
                        // Set values
                        var nativeInputValueSetter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, "value").set;
                        
                        // Use native setter if possible to bypass React/Vue blockers
                        if (nativeInputValueSetter) {
                            nativeInputValueSetter.call(u, "admin");
                            nativeInputValueSetter.call(p, "admin123");
                        } else {
                            u.value = "admin";
                            p.value = "admin123";
                        }

                        // Dispatch bubbling events
                        ["input", "change", "blur"].forEach(function(evt) {
                            u.dispatchEvent(new Event(evt, { bubbles: true }));
                            p.dispatchEvent(new Event(evt, { bubbles: true }));
                        });

                        setTimeout(function() {
                            console.log("Technitium Autologin: Clicking login...");
                            b.click();
                        }, 500);
                        
                        clearInterval(interval);
                    }
                }
                
                if (attempts >= maxAttempts) {
                    clearInterval(interval);
                }
            }, 500);
        })();
        </script></body>';
        
        sub_filter_once off;
    }
}
