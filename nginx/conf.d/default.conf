server {
    listen 80;
    server_name localhost;

    # Dashboard (Main App)
    location / {
        proxy_pass http://dns-dashboard:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AdGuard Home
    location /adguard/ {
        proxy_pass http://dns-adguard:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Basic YWRtaW46YWRtaW4xMjM=";

        # Rewrite redirect headers (Location: /login.html -> Location: /adguard/login.html)
        proxy_redirect / /adguard/;
        proxy_cookie_path / /adguard/;

        # Rewrite content to support subpath
        sub_filter_types text/html text/css text/javascript application/javascript;
        sub_filter 'href="/' 'href="/adguard/';
        sub_filter 'src="/' 'src="/adguard/';
        sub_filter 'action="/' 'action="/adguard/';
        sub_filter_once off;
    }

    # Technitium DNS
    location /technitium/ {
        proxy_pass http://dns-technitium:5380/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Basic YWRtaW46YWRtaW4xMjM=";
        
        # Rewrite cookies path
        proxy_cookie_path / /technitium/;

        # Rewrite content to support subpath
        sub_filter_types text/html text/css text/javascript application/javascript;
        sub_filter 'href="/' 'href="/technitium/';
        sub_filter 'src="/' 'src="/technitium/';
        sub_filter 'action="/' 'action="/technitium/';

        # Technitium specific API rewrites might be needed
        sub_filter '/api/' '/technitium/api/';
        
        # Inject Autologin Script (Basic Auth doesn't work for Web UI)
        sub_filter '</body>' '<script>
        window.addEventListener("load", function() {
            setTimeout(function() {
                var u = document.getElementById("user");
                var p = document.getElementById("pass");
                // Try to find the login button (often #login-btn or just a button in the form)
                var b = document.getElementById("login-btn") || document.querySelector("button.btn-primary") || document.querySelector("button[type=submit]");
                
                // Only run if we see the login form and it is empty
                if (u && p && b && u.value === "") {
                    console.log("Technitium Autologin: Injecting credentials...");
                    u.value = "admin";
                    p.value = "admin123"; 
                    // Trigger input events so frameworks detect change
                    u.dispatchEvent(new Event("input", { bubbles: true }));
                    p.dispatchEvent(new Event("input", { bubbles: true }));
                    
                    setTimeout(function() {
                        b.click();
                    }, 200);
                }
            }, 500);
        });
        </script></body>';
        
        sub_filter_once off;
    }
}
